<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>林默 | 个人名片</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<!-- 页面主内容：个人名片卡片 -->
	<main class="page-container">
		<article class="profile-card">
			<!-- 使用姓名首字母作为头像占位，避免依赖外部图片资源 -->
			<div class="avatar" aria-label="林默的头像">LM</div>

			<div class="profile-content">
				<!-- 个人基本信息 -->
				<p class="eyebrow">PERSONAL PROFILE</p>
				<h1>林默</h1>
				<p class="job-title">产品设计师</p>

				<!-- 联系方式列表 -->
				<address class="contact-list">
					<a href="mailto:linmo@example.com">
						<span class="contact-icon" aria-hidden="true">@</span>
						<span>linmo@example.com</span>
					</a>
					<a href="tel:+8613800138000">
						<span class="contact-icon" aria-hidden="true">↗</span>
						<span>+86 138 0013 8000</span>
					</a>
					<a href="https://www.example.com" target="_blank" rel="noopener noreferrer">
						<span class="contact-icon" aria-hidden="true">↗</span>
						<span>www.example.com</span>
					</a>
				</address>
			</div>
		</article>
	</main>
</body>
</html>
